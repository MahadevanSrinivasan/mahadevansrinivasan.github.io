<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Super Leo City: Hero Patrol & Stunt Sandbox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%; height: 100%;
      background: #090d16;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #game-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
    }
    canvas {
      max-width: 100vw;
      max-height: 100vh;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      box-shadow: 0 20px 60px rgba(0,0,0,0.85);
    }
    #touch-controls {
      display: none;
      position: absolute;
      bottom: 18px;
      left: 18px;
      right: 18px;
      justify-content: space-between;
      pointer-events: none;
      z-index: 20;
    }
    @media (pointer: coarse) {
      #touch-controls { display: flex; }
    }
    .touch-pad {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }
    .tbtn {
      width: 60px; height: 60px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.78);
      border: 2px solid rgba(255, 255, 255, 0.28);
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .tbtn:active {
      background: rgba(56, 189, 248, 0.55);
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
    <div id="touch-controls">
      <div class="touch-pad">
        <button class="tbtn" data-key="ArrowLeft">◀</button>
        <button class="tbtn" data-key="ArrowDown">▼</button>
        <button class="tbtn" data-key="ArrowUp">▲</button>
        <button class="tbtn" data-key="ArrowRight">▶</button>
      </div>
      <div class="touch-pad">
        <button class="tbtn" data-key="KeyE" style="background:rgba(16,185,129,0.8)">HOP</button>
        <button class="tbtn" data-key="KeyZ" style="background:rgba(59,130,246,0.8)">ACT</button>
        <button class="tbtn" data-key="Space" style="background:rgba(245,158,11,0.85)">NITRO</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
